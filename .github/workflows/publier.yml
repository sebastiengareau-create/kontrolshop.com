# Publie le site www.kontrolshop.com (tout ce dépôt) sur l'hébergement WHC,
# par FTP sécurisé (FTPS), dès qu'une modification arrive dans main. Aussi
# lancé à la main : Actions → « Publier kontrolshop.com » → Run workflow. N'envoie que les fichiers changés.
#
# À régler une fois dans GitHub → Settings → Secrets and variables → Actions :
#   Secrets   FTP_SERVEUR        nom d'hôte du serveur WHC (ex. xxxx.whc.ca)
#             FTP_UTILISATEUR    compte FTP créé dans cPanel
#             FTP_MOT_DE_PASSE   son mot de passe
#   Variable  FTP_DOSSIER        (facultatif) dossier du site vu par ce compte
#                                FTP, terminé par / — défaut public_html/ (le
#                                compte FTP s'ouvre dans /home/<compte cPanel>/)
# Voir README.md.
name: Publier kontrolshop.com

on:
  push:
    # main publie ; une branche claude/… fait seulement un essai (dry-run) :
    # connexion FTP et liste de ce qui serait envoyé, sans rien changer.
    branches: [main, "claude/**"]
  workflow_dispatch:

concurrency:
  group: site-kontrolshop
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les accès FTP
        id: acces
        env:
          SERVEUR: ${{ secrets.FTP_SERVEUR }}
          UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
          MOT_DE_PASSE: ${{ secrets.FTP_MOT_DE_PASSE }}
          # Noms des variables (pas des secrets), pour repérer un secret mis
          # par erreur dans l'onglet Variables
          NOMS_VARIABLES: ${{ toJSON(vars) }}
        run: |
          manque=""
          [ -n "$SERVEUR" ] || manque="$manque FTP_SERVEUR"
          [ -n "$UTILISATEUR" ] || manque="$manque FTP_UTILISATEUR"
          [ -n "$MOT_DE_PASSE" ] || manque="$manque FTP_MOT_DE_PASSE"
          if [ -n "$manque" ]; then
            echo "::warning::Secrets introuvables :$manque — rien n'est publié. Voir README.md."
            echo "Variables trouvées (noms) : $(echo "$NOMS_VARIABLES" | jq -r 'keys | join(", ")')"
            echo "pret=non" >> "$GITHUB_OUTPUT"
          else
            echo "pret=oui" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.acces.outputs.pret == 'oui'

      - name: Voir le dossier de destination
        if: steps.acces.outputs.pret == 'oui'
        env:
          SERVEUR: ${{ secrets.FTP_SERVEUR }}
          UTILISATEUR: ${{ secrets.FTP_UTILISATEUR }}
          MOT_DE_PASSE: ${{ secrets.FTP_MOT_DE_PASSE }}
          DOSSIER: ${{ vars.FTP_DOSSIER || 'public_html/' }}
        run: |
          # Noms seulement. Si on y voit public_html, mail, etc., le compte
          # FTP s'ouvre à la racine du compte cPanel : régler FTP_DOSSIER.
          liste=$(curl -sS --ssl-reqd --list-only --user "$UTILISATEUR:$MOT_DE_PASSE" "ftp://$SERVEUR/${DOSSIER#./}") || true
          echo "Contenu de la destination : $(echo "$liste" | tr '\r\n' '  ')"
          if echo "$liste" | grep -qx 'public_html'; then
            echo "::warning::La destination contient public_html : le site serait envoyé au mauvais endroit. Mettre la variable FTP_DOSSIER = public_html/ (voir README.md)."
          fi

      - name: Envoyer le site
        if: steps.acces.outputs.pret == 'oui'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVEUR }}
          username: ${{ secrets.FTP_UTILISATEUR }}
          password: ${{ secrets.FTP_MOT_DE_PASSE }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ vars.FTP_DOSSIER || 'public_html/' }}
          dry-run: ${{ github.ref != 'refs/heads/main' }}
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            README.md
            .github/**
